services:
  - type: web
    name: uow-computing-advisor
    runtime: node
    plan: free
    region: singapore # or oregon / frankfurt / ohio
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard -> Environment
